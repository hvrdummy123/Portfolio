<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">PayBench architecture</title>
  <desc id="desc">Agent calls tools against a deterministic payments simulator; graders score world state; analysis builds taxonomy and site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5eead4"/>
    </marker>
    <style>
      .box { fill:#15202b; stroke:#2dd4bf; stroke-width:1.5; rx:10; }
      .box2 { fill:#1c2836; stroke:#64748b; stroke-width:1.2; rx:10; }
      .h { fill:#f8fafc; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; font-weight:700; }
      .s { fill:#94a3b8; font-family:ui-sans-serif,system-ui,sans-serif; font-size:12px; }
      .label { fill:#5eead4; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    </style>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="32" y="36" class="h" font-size="18">PayBench · how an episode runs</text>

  <rect class="box" x="40" y="70" width="160" height="90"/>
  <text x="56" y="105" class="h">Agent</text>
  <text x="56" y="128" class="s">Oracle · Naive · LLM</text>
  <text x="56" y="146" class="s">tool-calling loop</text>

  <rect class="box" x="260" y="70" width="200" height="90"/>
  <text x="276" y="105" class="h">26 Tools</text>
  <text x="276" y="128" class="s">read · action · control</text>
  <text x="276" y="146" class="s">finish / get_policy</text>

  <rect class="box" x="520" y="55" width="220" height="120"/>
  <text x="536" y="90" class="h">Simulator World</text>
  <text x="536" y="113" class="s">ledger · customers · cards</text>
  <text x="536" y="131" class="s">faults · virtual clock</text>
  <text x="536" y="149" class="s">state_hash (deterministic)</text>

  <rect class="box2" x="780" y="70" width="140" height="90"/>
  <text x="796" y="105" class="h">Policy</text>
  <text x="796" y="128" class="s">P1P9</text>
  <text x="796" y="146" class="s">soft + checkers</text>

  <rect class="box" x="260" y="230" width="200" height="90"/>
  <text x="276" y="265" class="h">State Graders</text>
  <text x="276" y="288" class="s">required / forbidden</text>
  <text x="276" y="306" class="s">not prose scoring</text>

  <rect class="box" x="520" y="230" width="220" height="90"/>
  <text x="536" y="265" class="h">Analysis</text>
  <text x="536" y="288" class="s">F1F15 taxonomy</text>
  <text x="536" y="306" class="s">pass@1 · CI · site</text>

  <rect class="box2" x="40" y="230" width="160" height="90"/>
  <text x="56" y="265" class="h">Tasks</text>
  <text x="56" y="288" class="s">50 total / 25 core</text>
  <text x="56" y="306" class="s">gold + traps</text>

  <line x1="200" y1="115" x2="255" y2="115" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="115" x2="515" y2="115" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="115" x2="775" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="160" x2="120" y2="225" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="175" x2="360" y2="225" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="275" x2="515" y2="275" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="32" y="380" class="label">TIMEOUT_AFTER_COMMIT · idempotency · injection · mutation-tested graders</text>
</svg>
